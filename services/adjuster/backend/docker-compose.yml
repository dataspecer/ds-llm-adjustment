version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: adjuster-postgres
    environment:
      POSTGRES_DB: adjuster
      POSTGRES_USER: adjuster
      POSTGRES_PASSWORD: adjuster123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjuster"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: 