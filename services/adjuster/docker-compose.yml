version: '3.8'

services:

  ollama:
    image: ollama/ollama:latest
    container_name: adjuster-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MISTRAL_MODEL=${OLLAMA_MISTRAL_MODEL:-ministral-3:3b}
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - adjuster-network
    command: >
      /bin/sh -lc "
      ollama serve &
      until curl -sS http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 1; done;
      echo pulling ${OLLAMA_MISTRAL_MODEL};
      ollama pull ${OLLAMA_MISTRAL_MODEL} || true;
      wait
      "

  dataspecer:
    build:
      context: ../../
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    environment:
      - BASE_URL=http://localhost
      - MCP_ENABLED=1
      - MCP_BASE_PATH=/api/mcp
      - MCP_AUTH_SECRET=1234567890
    volumes:
      - ../../database:/usr/src/app/database
    networks:
      - adjuster-network

  frontend:
    build:
      context: ./frontend/dataspecer-validator-ui
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_CHANGES_DETECTOR_URL=http://localhost:3101
      - NEXT_PUBLIC_CHANGES_SUGGESTER_URL=http://localhost:3102
      - NEXT_PUBLIC_DIALOG_HANDLER_URL=http://localhost:3100
      - NEXT_PUBLIC_DATASPECER_BACKEND=http://localhost:3002
    depends_on:
      - changes-detector
      - changes-suggester
      - dialogs-handler
    volumes:
      - ./frontend/dataspecer-validator-ui:/app
      - /app/node_modules
    networks:
      - adjuster-network

  changes-detector:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3101:3101"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CORS_ORIGIN=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATASPECER_BACKEND_URL=http://dataspecer:80
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - dataspecer
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adjuster-network
    command: npm run start:dev changes-detector

  changes-suggester:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3102:3102"
    environment:
      - NODE_ENV=development
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CORS_ORIGIN=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adjuster-network
    command: npm run start:dev changes-suggester

  dialogs-handler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=development
      - PORT=3100
      - MCP_ENABLED=1
      - MCP_BASE_PATH=/api/mcp
      - MCP_AUTH_SECRET=1234567890
      - DATABASE_URL=postgresql://adjuster:adjuster123@postgres:5432/adjuster
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CORS_ORIGIN=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - postgres
      - ollama
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adjuster-network
    command: npm run start:dev dialogs-handler

  dataspecer-adapter:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3104:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATASPECER_MCP_BASE_URL=http://dataspecer/api/mcp
      - DATASPECER_MCP_TOKEN=1234567890
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CORS_ORIGIN=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    env_file:
      - .env
    depends_on:
      - rabbitmq
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adjuster-network
    command: npm run start:dev dataspecer-adapter

  artifacts-embedder:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3103:3103"
    environment:
      - NODE_ENV=development
      - PORT=3103
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - CORS_ORIGIN=http://localhost:3001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=artifacts
      - QDRANT_VECTOR_SIZE=1536
      - DATASPECER_BACKEND_URL=http://dataspecer:80
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - qdrant
      - dataspecer
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - adjuster-network
    command: npm run start:dev artifacts-embedder

  postgres:
    image: postgres:15
    container_name: adjuster-postgres
    environment:
      POSTGRES_DB: adjuster
      POSTGRES_USER: adjuster
      POSTGRES_PASSWORD: adjuster123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adjuster"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - adjuster-network
 
  pgadmin:
     image: dpage/pgadmin4:latest
     container_name: adjuster-pgadmin
     environment:
       - PGADMIN_DEFAULT_EMAIL=admin@local.dev
       - PGADMIN_DEFAULT_PASSWORD=admin
     ports:
       - "5050:80"
     depends_on:
       - postgres
     volumes:
       - pgadmin_data:/var/lib/pgadmin
     networks:
       - adjuster-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - adjuster-network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - adjuster-network

volumes:
  rabbitmq_data:
    driver: local
  postgres_data:
    driver: local
  qdrant_storage:
    driver: local
  pgadmin_data:
    driver: local
  ollama_data:
    driver: local

networks:
  adjuster-network:
    driver: bridge 